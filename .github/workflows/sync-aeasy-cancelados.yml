name: Sync AEasy Cancelados (Recuperacao)

on:
  # Executa diariamente as 7h BRT (10:00 UTC)
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync Cancelados from AEasy to Supabase (tabela recuperacao)
        env:
          AEASY_BASE_URL: ${{ secrets.AEASY_BASE_URL }}
          AEASY_LOGIN: ${{ secrets.AEASY_LOGIN }}
          AEASY_PASSWORD: ${{ secrets.AEASY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node << 'EOF'
          const AEASY_URL = process.env.AEASY_BASE_URL || "https://aeasy.autovaleprevencoes.org";
          const AEASY_LOGIN = process.env.AEASY_LOGIN;
          const AEASY_PASSWORD = process.env.AEASY_PASSWORD;
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

          async function main() {
            console.log("[sync-cancelados] 1. Login na AEasy...");

            const loginRes = await fetch(`${AEASY_URL}/conta/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ UsuariosLogin: AEASY_LOGIN, UsuariosSenha: AEASY_PASSWORD }),
              redirect: "manual",
            });

            const cookies = loginRes.headers.get("set-cookie") || "";
            const match = cookies.match(/PHPSESSID=([^;]+)/);
            if (!match) {
              console.error("[sync-cancelados] FALHA login. Status:", loginRes.status);
              process.exit(1);
            }
            const sessionId = match[1];
            console.log("[sync-cancelados] 2. Login OK");

            // Busca cancelados dos ULTIMOS 90 DIAS (por data de cancelamento)
            // Filtro: TipoData=VendasDataCancelamento + DataInicial/DataFinal
            function buildBody(start, length) {
              const now = new Date();
              const dataFinal = now.toISOString().split("T")[0];
              const dataInicial = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000).toISOString().split("T")[0];

              const parts = [
                `draw=1`, `start=${start}`, `length=${length}`,
                `columns[0][data]=ClientesIndividuosNome`,
                `columns[0][name]=ClientesIndividuosNome`,
                `columns[0][searchable]=false`, `columns[0][orderable]=true`,
                `columns[0][search][value]=`, `columns[0][search][regex]=false`,
                `order[0][column]=0`, `order[0][dir]=asc`,
                `formPesquisa[VendasSituacao][]=3`,
                `formPesquisa[TipoData]=VendasDataCancelamento`,
                `formPesquisa[DataInicial]=${dataInicial}`,
                `formPesquisa[DataFinal]=${dataFinal}`,
                `formPesquisa[submitFilter]=true`,
                `formPesquisa[DepartNivel]=1`,
              ];
              return parts.join("&");
            }

            console.log("[sync-cancelados] 3. Buscando cancelados dos ultimos 90 dias...");
            const allVendas = [];
            const pageSize = 1000;

            const firstRes = await fetch(`${AEASY_URL}/vendas/listagem/`, {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                "X-Requested-With": "XMLHttpRequest",
                "Cookie": `PHPSESSID=${sessionId}`,
              },
              body: buildBody(0, pageSize),
            });

            const firstData = await firstRes.json();
            const total = parseInt(firstData.recordsFiltered || "0", 10);
            allVendas.push(...(firstData.data || []));
            console.log(`[sync-cancelados] Total cancelados na AEasy: ${total}. Pagina 1: ${firstData.data?.length || 0}`);

            let start = pageSize;
            while (start < total) {
              await new Promise(r => setTimeout(r, 300));
              const res = await fetch(`${AEASY_URL}/vendas/listagem/`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "X-Requested-With": "XMLHttpRequest",
                  "Cookie": `PHPSESSID=${sessionId}`,
                },
                body: buildBody(start, pageSize),
              });
              const page = await res.json();
              allVendas.push(...(page.data || []));
              start += pageSize;
              console.log(`[sync-cancelados]   pagina ${Math.ceil(start / pageSize)}: ${allVendas.length}/${total}`);
            }

            console.log(`[sync-cancelados] 4. Total coletado: ${allVendas.length}`);

            if (allVendas.length === 0) {
              console.log("[sync-cancelados] Nenhum cancelado. Encerrando sem limpar tabela.");
              return;
            }

            const now = new Date();
            const mapped = allVendas.map(v => ({
              aeasy_venda_id: String(v.VendasId),
              chassi: v.CarrosChassi || v.VendasCarrosPlaca || "",
              associado: v.ClientesIndividuosNome || "",
              documento: v.ClientesIndividuosDocumento || "",
              telefone: `(${v.ClientesIndividuosContatosDdd || ""}) ${v.ClientesIndividuosContatosTelefone || ""}`,
              placa: v.VendasCarrosPlaca || "",
              modelo: `${v.VendasCarrosMarcasNome || ""} ${v.VendasCarrosModelosNome || ""}`.trim(),
              valor_original: v.VendasValor || "",
              dia_vencimento: v.VendasVencimento || "",
              data_cancelamento: v.VendasDataCancelamento || v.VendasDataSuspensao || "",
              dias_cancelado: parseInt(v.VendasDiasAtraso || "0", 10),
              consultor: v.ConsultoresNome || "",
              sede: v.ConsultoresCentroCustoNome || "",
              plano: v.VendasCarrosCategoriasPlanosNome || "",
              sincronizado_em: now.toISOString(),
            }));

            // DEDUPLICACAO por CHASSI + ASSOCIADO (chave composta)
            // Mesmo chassi + associado diferente = registro VALIDO (manter)
            // Mesmo chassi + mesmo associado = DUPLICADO (ignorar)
            const dedupMap = new Map();
            for (const r of mapped) {
              const key = `${(r.chassi || "").toUpperCase().trim()}|${(r.associado || "").toUpperCase().trim()}`;
              // Se ja existe com mesma chave, manter o mais recente (ultima ocorrencia)
              dedupMap.set(key, r);
            }
            const records = Array.from(dedupMap.values());
            const chassisUnicos = new Set(records.map(r => r.chassi)).size;
            console.log(`[sync-cancelados] 5. Dedup (chassi+associado): ${records.length} unicos | ${chassisUnicos} chassis distintos`);

            const batchSize = 500;
            let inserted = 0;
            let errors = 0;

            for (let i = 0; i < records.length; i += batchSize) {
              const batch = records.slice(i, i + batchSize);
              const res = await fetch(`${SUPABASE_URL}/rest/v1/recuperacao`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": SUPABASE_KEY,
                  "Authorization": `Bearer ${SUPABASE_KEY}`,
                  "Prefer": "resolution=merge-duplicates",
                },
                body: JSON.stringify(batch),
              });

              if (!res.ok) {
                const err = await res.text();
                console.error(`[sync-cancelados] Erro batch: ${err.substring(0, 200)}`);
                for (const rec of batch) {
                  const sr = await fetch(`${SUPABASE_URL}/rest/v1/recuperacao`, {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "apikey": SUPABASE_KEY,
                      "Authorization": `Bearer ${SUPABASE_KEY}`,
                      "Prefer": "resolution=merge-duplicates",
                    },
                    body: JSON.stringify([rec]),
                  });
                  if (sr.ok) inserted++; else errors++;
                }
              } else {
                inserted += batch.length;
              }
            }

            console.log(`[sync-cancelados] 6. Upsert: ${inserted} OK, ${errors} erros`);

            // Limpeza: remove quem saiu de Cancelado E nao tem atendente
            console.log("[sync-cancelados] 7. Limpeza...");
            const currentIdSet = new Set(records.map(r => r.aeasy_venda_id));
            let existingRecords = [];
            let dbFrom = 0;
            let dbHasMore = true;
            while (dbHasMore) {
              const dbRes = await fetch(
                `${SUPABASE_URL}/rest/v1/recuperacao?select=aeasy_venda_id,atendente&aeasy_venda_id=not.is.null&offset=${dbFrom}&limit=5000`,
                { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
              );
              const dbData = await dbRes.json();
              if (dbData && dbData.length > 0) { existingRecords.push(...dbData); dbFrom += 5000; dbHasMore = dbData.length === 5000; }
              else dbHasMore = false;
            }

            const toRemove = existingRecords.filter(r =>
              !currentIdSet.has(r.aeasy_venda_id) && (!r.atendente || r.atendente.trim() === "")
            );

            if (toRemove.length > 0) {
              for (let i = 0; i < toRemove.length; i += 50) {
                const batch = toRemove.slice(i, i + 50).map(r => r.aeasy_venda_id);
                const idsParam = batch.map(id => `"${id}"`).join(",");
                await fetch(
                  `${SUPABASE_URL}/rest/v1/recuperacao?aeasy_venda_id=in.(${idsParam})`,
                  { method: "DELETE", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
                );
              }
              console.log(`[sync-cancelados]   ${toRemove.length} removidos`);
            }

            console.log(`[sync-cancelados] 8. CONCLUIDO! ${inserted} inseridos, ${toRemove.length} removidos, ${placasUnicas} placas`);

            await fetch(`${SUPABASE_URL}/rest/v1/logs`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
              body: JSON.stringify({
                usuario: "GitHub Actions",
                email: "ci@avp-system",
                perfil: "System",
                acao: "Sync AEasy Cancelados (Recuperacao)",
                campo: "quantidade",
                depois: `${inserted} inseridos, ${toRemove.length} removidos, ${placasUnicas} placas`,
              }),
            });
          }

          main().catch(e => { console.error("[sync-cancelados] FATAL:", e); process.exit(1); });
          EOF
