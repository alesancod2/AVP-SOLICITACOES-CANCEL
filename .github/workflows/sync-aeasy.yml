name: Sync AEasy Suspensos

on:
  # Executa a cada 1 hora
  schedule:
    - cron: '0 * * * *'
  # Permite executar manualmente
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Sync Suspensos from AEasy to Supabase
        env:
          AEASY_BASE_URL: ${{ secrets.AEASY_BASE_URL }}
          AEASY_LOGIN: ${{ secrets.AEASY_LOGIN }}
          AEASY_PASSWORD: ${{ secrets.AEASY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node << 'EOF'
          const AEASY_URL = process.env.AEASY_BASE_URL || "https://aeasy.autovaleprevencoes.org";
          const AEASY_LOGIN = process.env.AEASY_LOGIN;
          const AEASY_PASSWORD = process.env.AEASY_PASSWORD;
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

          async function main() {
            console.log("[sync] 1. Login na AEasy...");

            // LOGIN
            const loginRes = await fetch(`${AEASY_URL}/conta/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ UsuariosLogin: AEASY_LOGIN, UsuariosSenha: AEASY_PASSWORD }),
              redirect: "manual",
            });

            const cookies = loginRes.headers.get("set-cookie") || "";
            const match = cookies.match(/PHPSESSID=([^;]+)/);
            if (!match) {
              console.error("[sync] FALHA login. Status:", loginRes.status);
              const body = await loginRes.text().catch(() => "");
              console.error("[sync] Body:", body.substring(0, 300));
              process.exit(1);
            }
            const sessionId = match[1];
            console.log("[sync] 2. Login OK:", sessionId.substring(0, 10) + "...");

            // BUILD BODY - usar pageSize maior para reduzir requests
            function buildBody(start, length) {
              const now = new Date();
              const firstDay = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-01`;
              const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
              const parts = [
                `draw=1`, `start=${start}`, `length=${length}`,
                `columns[0][data]=ClientesIndividuosNome`,
                `columns[0][name]=ClientesIndividuosNome`,
                `columns[0][searchable]=false`, `columns[0][orderable]=true`,
                `columns[0][search][value]=`, `columns[0][search][regex]=false`,
                `order[0][column]=0`, `order[0][dir]=asc`,
                `formPesquisa[VendasSituacao][]=2`,
                `formPesquisa[TipoData]=VendasDataSuspensao`,
                `formPesquisa[DataInicial]=${firstDay}`,
                `formPesquisa[DataFinal]=${today}`,
                `formPesquisa[submitFilter]=true`,
                `formPesquisa[DepartNivel]=1`,
                `formPesquisa[VendasVencimento][]=5`,
                `formPesquisa[VendasVencimento][]=10`,
                `formPesquisa[VendasVencimento][]=15`,
                `formPesquisa[VendasVencimento][]=20`,
                `formPesquisa[VendasVencimento][]=25`,
                `formPesquisa[VendasVencimento][]=30`,
              ];
              return parts.join("&");
            }

            // FETCH SUSPENSOS - pagina com 500 registros por vez para pegar TODOS
            console.log("[sync] 3. Buscando suspensos...");
            const allVendas = [];
            const pageSize = 500;

            const firstRes = await fetch(`${AEASY_URL}/vendas/listagem/`, {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                "X-Requested-With": "XMLHttpRequest",
                "Cookie": `PHPSESSID=${sessionId}`,
              },
              body: buildBody(0, pageSize),
            });

            const firstData = await firstRes.json();
            const total = parseInt(firstData.recordsFiltered || "0", 10);
            allVendas.push(...(firstData.data || []));
            console.log(`[sync] Total registros na AEasy: ${total}. Pagina 1: ${firstData.data?.length || 0}`);

            let start = pageSize;
            while (start < total) {
              await new Promise(r => setTimeout(r, 400));
              const res = await fetch(`${AEASY_URL}/vendas/listagem/`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "X-Requested-With": "XMLHttpRequest",
                  "Cookie": `PHPSESSID=${sessionId}`,
                },
                body: buildBody(start, pageSize),
              });
              const page = await res.json();
              allVendas.push(...(page.data || []));
              start += pageSize;
              console.log(`[sync]   ... pagina ${Math.ceil(start / pageSize)}: ${allVendas.length}/${total} registros`);
            }

            console.log(`[sync] 4. Total coletado da AEasy: ${allVendas.length}`);

            if (allVendas.length === 0) {
              console.log("[sync] Nenhum suspenso encontrado. Limpando tabela...");
              // Se AEasy nao retornou nenhum suspenso, todos voltaram a Ativo
              await fetch(`${SUPABASE_URL}/rest/v1/suspensos?aeasy_venda_id=not.is.null`, {
                method: "DELETE",
                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": `Bearer ${SUPABASE_KEY}`,
                },
              });
              return;
            }

            // MAPEAR + DEDUPLICAR
            const now = new Date();
            const mapped = allVendas.map(v => {
              // Mapear situacao numerica da AEasy para texto legivel
              const situacaoMap = {
                "1": "Ativo",
                "2": "Suspenso",
                "3": "Cancelado",
                "4": "Inadimplente",
              };
              const situacaoRaw = String(v.VendasSituacao || "2");
              const situacaoTexto = situacaoMap[situacaoRaw] || "Suspenso";

              return {
                aeasy_venda_id: String(v.VendasId),
                associado: v.ClientesIndividuosNome || "",
                documento: v.ClientesIndividuosDocumento || "",
                telefone: `(${v.ClientesIndividuosContatosDdd || ""}) ${v.ClientesIndividuosContatosTelefone || ""}`,
                placa: v.VendasCarrosPlaca || "",
                modelo: `${v.VendasCarrosMarcasNome || ""} ${v.VendasCarrosModelosNome || ""}`.trim(),
                marca: v.VendasCarrosMarcasNome || "",
                valor_original: v.VendasValor || "",
                valor_contribuicao: v.VendasValor || "",
                dia_vencimento: v.VendasVencimento || "",
                dt_vencimento: `${(v.VendasVencimento || "10").padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}/${now.getFullYear()}`,
                data_suspensao: v.VendasDataSuspensao || "",
                dias_atraso: parseInt(v.VendasDiasAtraso || "0", 10),
                faturas_pagas: parseInt(v.VendasQuantidadeFaturasPagas || "0", 10),
                faturas_atraso: parseInt(v.VendasQuantidadeFaturasAtraso || "0", 10),
                tipo_suspensao: v.VendasTipoSuspensao || "",
                consultor: v.ConsultoresNome || "",
                sede: v.ConsultoresCentroCustoNome || "",
                plano: v.VendasCarrosCategoriasPlanosNome || "",
                forma_pagamento: "",
                situacao_aeasy: situacaoTexto,
                sincronizado_em: now.toISOString(),
              };
            });

            // DEDUPLICAR por aeasy_venda_id (manter ultimo)
            const dedupMap = new Map();
            for (const r of mapped) {
              dedupMap.set(r.aeasy_venda_id, r);
            }
            const records = Array.from(dedupMap.values());
            console.log(`[sync] 5. Apos dedup: ${records.length} unicos (de ${mapped.length})`);

            // Coletar todos os aeasy_venda_ids atualmente suspensos
            const currentIds = records.map(r => r.aeasy_venda_id);

            // GRAVAR NO SUPABASE em lotes (upsert por aeasy_venda_id)
            const batchSize = 200;
            let inserted = 0;
            let errors = 0;

            for (let i = 0; i < records.length; i += batchSize) {
              const batch = records.slice(i, i + batchSize);
              const res = await fetch(`${SUPABASE_URL}/rest/v1/suspensos`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": SUPABASE_KEY,
                  "Authorization": `Bearer ${SUPABASE_KEY}`,
                  "Prefer": "resolution=merge-duplicates",
                },
                body: JSON.stringify(batch),
              });

              if (!res.ok) {
                const err = await res.text();
                console.error(`[sync] Erro batch ${Math.floor(i / batchSize) + 1}: ${res.status} - ${err.substring(0, 200)}`);
                // Tentar um por um
                for (const rec of batch) {
                  const singleRes = await fetch(`${SUPABASE_URL}/rest/v1/suspensos`, {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "apikey": SUPABASE_KEY,
                      "Authorization": `Bearer ${SUPABASE_KEY}`,
                      "Prefer": "resolution=merge-duplicates",
                    },
                    body: JSON.stringify([rec]),
                  });
                  if (singleRes.ok) {
                    inserted++;
                  } else {
                    errors++;
                    if (errors <= 3) {
                      const e = await singleRes.text();
                      console.error(`[sync]   Erro individual (${rec.aeasy_venda_id}): ${e.substring(0, 100)}`);
                    }
                  }
                }
              } else {
                inserted += batch.length;
              }

              if ((i + batchSize) % 1000 === 0 || i + batchSize >= records.length) {
                console.log(`[sync]   ... ${inserted} inseridos/atualizados, ${errors} erros`);
              }
            }

            console.log(`[sync] 6. Upsert completo: ${inserted} OK, ${errors} erros`);

            // =============================================
            // REMOVER ASSOCIADOS QUE VOLTARAM A "ATIVO"
            // Deleta registros no Supabase que NAO estao mais na lista da AEasy
            // (apenas os que foram sincronizados previamente via aeasy_venda_id)
            // =============================================
            console.log("[sync] 7. Removendo associados que voltaram a Ativo...");

            // Buscar todos os aeasy_venda_ids existentes no DB
            let existingIds = [];
            let dbFrom = 0;
            const dbPageSize = 1000;
            let dbHasMore = true;

            while (dbHasMore) {
              const dbRes = await fetch(
                `${SUPABASE_URL}/rest/v1/suspensos?select=aeasy_venda_id&aeasy_venda_id=not.is.null&offset=${dbFrom}&limit=${dbPageSize}`,
                {
                  headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                  },
                }
              );
              const dbData = await dbRes.json();
              if (dbData && dbData.length > 0) {
                existingIds.push(...dbData.map(r => r.aeasy_venda_id));
                dbFrom += dbPageSize;
                dbHasMore = dbData.length === dbPageSize;
              } else {
                dbHasMore = false;
              }
            }

            // IDs que estao no DB mas NAO vieram da AEasy = voltaram a Ativo
            const currentIdSet = new Set(currentIds);
            const idsToRemove = existingIds.filter(id => !currentIdSet.has(id));

            if (idsToRemove.length > 0) {
              console.log(`[sync]   Removendo ${idsToRemove.length} registros que voltaram a Ativo...`);
              // Deletar em lotes de 100 (limitacao URL do PostgREST)
              for (let i = 0; i < idsToRemove.length; i += 50) {
                const batch = idsToRemove.slice(i, i + 50);
                const idsParam = batch.map(id => `"${id}"`).join(",");
                const delRes = await fetch(
                  `${SUPABASE_URL}/rest/v1/suspensos?aeasy_venda_id=in.(${idsParam})`,
                  {
                    method: "DELETE",
                    headers: {
                      "apikey": SUPABASE_KEY,
                      "Authorization": `Bearer ${SUPABASE_KEY}`,
                    },
                  }
                );
                if (!delRes.ok) {
                  const err = await delRes.text();
                  console.error(`[sync]   Erro ao remover batch: ${err.substring(0, 100)}`);
                }
              }
              console.log(`[sync]   ${idsToRemove.length} registros removidos (voltaram a Ativo)`);
            } else {
              console.log("[sync]   Nenhum registro para remover.");
            }

            console.log(`[sync] 8. CONCLUIDO! ${inserted} sincronizados, ${idsToRemove.length} removidos (ativos)`);

            // LOG
            await fetch(`${SUPABASE_URL}/rest/v1/logs`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
              },
              body: JSON.stringify({
                usuario: "GitHub Actions",
                email: "ci@avp-system",
                perfil: "System",
                acao: "Sync AEasy Suspensos",
                campo: "quantidade",
                depois: `${inserted} sincronizados, ${idsToRemove.length} removidos`,
              }),
            });
          }

          main().catch(e => { console.error("[sync] FATAL:", e); process.exit(1); });
          EOF
